<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&family=Nunito:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>customer-web</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="global-error" style="position:fixed; top:0; left:0; z-index:999999; background:red; color:white; font-size:20px; font-weight:bold; padding:20px; display:none; width:100vw; height:100vh; overflow:auto;"></div>
    <script>
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        var errorDiv = document.getElementById('global-error');
        errorDiv.style.display = 'block';
        errorDiv.innerText = 'Runtime Error: ' + msg + '\n' + (error && error.stack ? error.stack : '');
        return false;
      };
      window.addEventListener('unhandledrejection', function(event) {
        var errorDiv = document.getElementById('global-error');
        errorDiv.style.display = 'block';
        errorDiv.innerText = 'Unhandled Promise Rejection: ' + (event.reason && event.reason.stack ? event.reason.stack : event.reason);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
