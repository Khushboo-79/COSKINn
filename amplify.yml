version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install
    build:
      commands:
        - npm run build -w customer-web
  artifacts:
    baseDirectory: apps/New/apps/customer-web/dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - apps/New/apps/customer-web/node_modules/**/*